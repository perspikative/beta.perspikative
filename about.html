<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>À propos – Perspikative</title>
  <meta name="description" content="Qui est derrière Perspikative ? Découvre l’artiste, le portfolio, l’univers, la communauté et l’ART Challenge.">
  <meta name="theme-color" content="#344f4a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Ton CSS global (header, footer, etc.) -->
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --ap-bg: #061a14;
      --ap-text: #e8f3f0;
      --ap-muted: #b7d0c9;
      --ap-accent: #5eead4;
      --ap-accent-2: #22d3ee;
      --ap-ink: #04231d;
      --ap-strip: 44px;     /* hauteur d’un bandeau (= cible tactile mini) */
      --ap-radius: 24px;
    }
    @media (min-width: 900px) {
      :root { --ap-strip: 52px; --ap-radius: 32px; }
    }

    .ap-skip {
      position: absolute;
      left: -9999px;
      top: 8px;
      z-index: 100;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--ap-accent);
      color: var(--ap-ink);
      font-weight: 500;
      text-decoration: none;
    }
    .ap-skip:focus { left: 12px; }

    .ap-main {
      background: #00000000;
      color: var(--ap-text);
      font-family: "Rubik", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      box-shadow: none;
      border: 0;
    }
    .ap-main *, .ap-main *::before, .ap-main *::after { box-sizing: border-box; }

    /* ---------- La pile ---------- */
    .ap-stack {
      --ap-top: 0px;       /* réglé en JS si ton header est sticky / fixed */
      position: relative;
    }

    /* Chaque carte colle en haut, décalée d’un bandeau par rang :
       les cartes suivantes glissent par-dessus et il ne reste visible
       que le bandeau des cartes passées. */
    .ap-card {
      --surface: #0d2a24;
      --i: 0;
      position: sticky;
      top: calc(var(--ap-top) + var(--i) * var(--ap-strip));
      height: calc(100vh - var(--ap-top) - var(--i) * var(--ap-strip));
      height: calc(100svh - var(--ap-top) - var(--i) * var(--ap-strip));
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--ap-radius) var(--ap-radius) 0 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 -14px 36px -12px rgba(0, 0, 0, .55);
      overflow: hidden;
      color-scheme: dark;
      transform-origin: 50% 0;
      transform: scale(calc(1 - 0.016 * var(--k, 0)));
      will-change: transform;
    }
    .ap-card:nth-of-type(1) { --surface: #0d2a24; }
    .ap-card:nth-of-type(2) { --surface: #0f3029; }
    .ap-card:nth-of-type(3) { --surface: #123730; }
    .ap-card:nth-of-type(4) { --surface: #153e36; }
    .ap-card:nth-of-type(5) { --surface: #19463d; }
    .ap-card:nth-of-type(6) { --surface: #1c4e44; }
    .ap-card:nth-of-type(7) { --surface: #20564b; }
    .ap-card:nth-of-type(8) { --surface: #245e52; }

    /* Assombrissement progressif quand une carte est recouverte */
    .ap-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #000;
      opacity: calc(var(--k, 0) * .08);
      border-radius: inherit;
      pointer-events: none;
    }

    /* ---------- Bandeau (titre cliquable) ---------- */
    .ap-tab {
      position: relative;
      z-index: 2;
      flex: none;
      display: grid;
      place-items: center;
      width: 100%;
      height: var(--ap-strip);
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ap-muted);
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .ap-tab > * { grid-area: 1 / 1; }

    /* La « poignée » disparaît quand le titre apparaît (carte recouverte) */
    .ap-tab-grabber {
      width: 36px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .28);
      opacity: calc(1 - var(--lab, 0));
      transition: background .2s;
    }
    .ap-tab:hover .ap-tab-grabber { background: rgba(255, 255, 255, .5); }

    .ap-tab-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .01em;
      opacity: var(--lab, 0);
      transition: color .2s;
    }
    .ap-tab-label svg { width: 14px; height: 14px; flex: none; }
    .ap-tab:hover .ap-tab-label { color: var(--ap-text); }

    .ap-tab:focus-visible { outline: 2px solid var(--ap-accent); outline-offset: -4px; }
    .ap-tab:focus-visible .ap-tab-label { opacity: 1; }
    .ap-tab:focus-visible .ap-tab-grabber { opacity: 0; }

    /* ---------- Contenu de la carte ---------- */
    .ap-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 clamp(20px, 5vw, 64px);
      overflow-y: auto;          /* filet de sécurité : très gros texte / petit écran */
      scrollbar-width: thin;
    }

    /* margin:auto = centrage vertical qui ne coupe jamais le haut si ça déborde */
    .ap-inner {
      width: 100%;
      max-width: 1120px;
      margin: auto;
      padding-block: 12px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    /* Illustration */
    .ap-art {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: clamp(96px, 22svh, 240px);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: var(--ap-radius);
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .09);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1);
    }
    .ap-art::before {
      content: "";
      position: absolute;
      inset: -30%;
      background: radial-gradient(closest-side, rgba(94, 234, 212, .18), transparent 70%);
      pointer-events: none;
    }
    .ap-art img {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .ap-art-fallback {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      border: 1.5px dashed rgba(255, 255, 255, .25);
      border-radius: calc(var(--ap-radius) - 8px);
      color: var(--ap-muted);
      font-size: .8rem;
      text-align: center;
      word-break: break-all;
    }

    /* Texte */
    .ap-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 36rem;
    }
    .ap-title {
      margin: 0;
      font-size: clamp(1.6rem, 6.4vw, 2.1rem);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -.02em;
      color: var(--ap-text);
      text-wrap: balance;
    }
    @supports (background-clip: text) or (-webkit-background-clip: text) {
      .ap-title {
        background: linear-gradient(90deg, var(--ap-text) 35%, var(--ap-accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    }
    /* Mobile : paragraphe centré avec bords droits (justifié) */
    .ap-p {
      margin: 0;
      color: var(--ap-muted);
      font-size: 1.0625rem;
      line-height: 1.6;
      text-align: justify;
      text-align-last: center;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    .ap-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--ap-accent), var(--ap-accent-2));
      color: var(--ap-ink);
      font-size: .95rem;
      font-weight: 500;
      text-decoration: none;
      transition: transform .2s ease, filter .2s ease;
    }
    .ap-cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .ap-cta:focus-visible { outline: 2px solid var(--ap-text); outline-offset: 3px; }

    /* ---------- Desktop : illustration à gauche, texte à droite ---------- */
    @media (min-width: 900px) {
      .ap-inner {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(32px, 6vw, 96px);
        text-align: left;
      }
      .ap-art {
        max-width: none;
        height: clamp(200px, 52svh, 460px);
        padding: 24px;
      }
      .ap-text {
        align-items: flex-start;
        justify-self: center;
        max-width: 30rem;
        gap: 18px;
      }
      .ap-title { font-size: clamp(2rem, 3.4vw, 3rem); }
      .ap-p {
        font-size: 1.125rem;
        text-align: left;
        text-align-last: auto;
        text-wrap: pretty;
      }
    }

    /* ---------- Accessibilité : mouvement réduit ---------- */
    @media (prefers-reduced-motion: reduce) {
      .ap-card { transform: none; will-change: auto; }
      .ap-cta, .ap-tab-grabber, .ap-tab-label { transition: none; }
      .ap-cta:hover { transform: none; }
    }

    .ap-noscript { padding: 48px 24px; text-align: center; color: var(--ap-muted); }
  </style>
</head>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>

  <script>
  (function () {
    "use strict";

    var useRef = React.useRef;
    var useState = React.useState;
    var useEffect = React.useEffect;
    var useCallback = React.useCallback;
    var html = htm.bind(React.createElement);

    /* ===================================================================
       CONTENU — modifie / ajoute / supprime des sections ici.
       Les illustrations sont cherchées dans /pics/cat/cat1.svg, cat2.svg…
       =================================================================== */
    var SECTIONS = [
      {
        id: "qui-suis-je",
        title: "Qui suis-je ?",
        img: "/pics/cat/cat-classic.svg",
        alt: "Illustration : qui est Tartineske",
        text: "Moi c’est Tartineske ! Artiste visuel et développeur créatif indépendant, je dessine, je code et je donne vie à des univers graphiques inspirés de la musique, des films et des séries que j’aime. Ici, tout est fait main, des illustrations jusqu’à la dernière ligne de code."
      },
      {
        id: "perspikative",
        title: "Perspikative, c’est quoi ?",
        img: "/pics/cat/cat2.svg",
        alt: "Illustration : le portfolio Perspikative",
        text: "Perspikative, c’est mon portfolio artistique et le lieu où tout se rassemble : créations, illustrations, projets et actus. Un espace pensé pour explorer mon travail tranquillement, mais aussi pour suivre ce qui se prépare dans l’ombre.",
        cta: { label: "Explorer le portfolio", href: "/portfolio" }
      },
      {
        id: "univers",
        title: "Mon univers",
        img: "/pics/cat/cat3.svg",
        alt: "Illustration : les inspirations de l’artiste",
        text: "Mes idées naissent devant un générique de série, au détour d’un morceau ou d’une scène de film. The Castle Byers, par exemple, est né de Stranger Things. Je garde ce qui me touche, puis je le transforme en images."
      },
      {
        id: "communaute",
        title: "La communauté",
        img: "/pics/cat/cat4.svg",
        alt: "Illustration : la communauté Perspikative",
        text: "Perspikative, ce n’est pas qu’un site : c’est aussi une communauté d’artistes et de curieux. On partage, on s’encourage et on discute sur Discord, sur la chaîne WhatsApp, sur Instagram ou sur YouTube. Viens, il y a de la place pour toi.",
        cta: { label: "Rejoindre la communauté", href: "/commu" }
      },
      {
        id: "art-challenge",
        title: "L’ART Challenge",
        img: "/pics/cat/cat5.svg",
        alt: "Illustration : l’ART Challenge",
        text: "Une à deux fois par an, je lance l’ART Challenge : un concours d’art visuel ouvert à tous. Thème, récompenses, galerie des gagnants… tout est sur sa page dédiée. Et si c’était ton tour de participer ?",
        cta: { label: "Découvrir l’ART Challenge", href: "/art-challenge" }
      }
    ];

    var reduceMotion = function () {
      return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    };

    /* ---------- Illustration (avec repli si le fichier n’existe pas encore) ---------- */
    function Illustration(props) {
      var failed = useState(false);
      if (failed[0]) {
        return html`<div className="ap-art-fallback" role="img" aria-label="Illustration à venir">${props.src}</div>`;
      }
      return html`<img src=${props.src} alt=${props.alt} loading=${props.eager ? "eager" : "lazy"} decoding="async" onError=${function () { failed[1](true); }} />`;
    }

    /* ---------- Une carte de la pile ---------- */
    function Card(props) {
      var s = props.section;
      var i = props.index;
      return html`
        <section className="ap-card" id=${s.id} aria-labelledby=${s.id + "-titre"}
                 ref=${function (el) { props.cardRefs.current[i] = el; }}
                 style=${{ "--i": i }}>
          <button type="button" className="ap-tab"
                  aria-label=${"Aller à la section « " + s.title + " »"}
                  onClick=${function () { props.onTabClick(i); }}>
            <span className="ap-tab-grabber" aria-hidden="true"></span>
            <span className="ap-tab-label" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="m6 15 6-6 6 6" /></svg>
              ${s.title}
            </span>
          </button>

          <div className="ap-body">
            <div className="ap-inner">
              <div className="ap-art">
                <${Illustration} src=${s.img} alt=${s.alt} eager=${i === 0} />
              </div>
              <div className="ap-text">
                <h2 className="ap-title" id=${s.id + "-titre"}>${s.title}</h2>
                <p className="ap-p">${s.text}</p>
                ${s.cta ? html`<a className="ap-cta" href=${s.cta.href}>${s.cta.label}</a>` : null}
              </div>
            </div>
          </div>
        </section>`;
    }

    /* ---------- L’application ---------- */
    function App() {
      var stackRef = useRef(null);
      var cardRefs = useRef([]);
      var geo = useRef({ ys: [] });   // scrollY auquel chaque carte « colle » en haut
      var raf = useRef(0);

      /* Position d’avancement continue (0 → n-1) + variables CSS par carte */
      var update = useCallback(function () {
        var ys = geo.current.ys;
        var cards = cardRefs.current;
        if (!ys.length) return;

        var y = window.scrollY;
        var last = ys.length - 1;
        var t = 0;
        if (y >= ys[last]) {
          t = last;
        } else if (y > ys[0]) {
          var j = 0;
          while (j < last - 1 && y >= ys[j + 1]) j++;
          t = j + (y - ys[j]) / ((ys[j + 1] - ys[j]) || 1);
        }

        var active = Math.round(t);
        for (var i = 0; i < cards.length; i++) {
          var c = cards[i];
          if (!c) continue;
          var k = Math.max(0, Math.min(t - i, 4));                 // profondeur dans la pile
          var lab = Math.max(0, Math.min((k - 0.25) / 0.5, 1));    // opacité du titre du bandeau
          c.style.setProperty("--k", k.toFixed(3));
          c.style.setProperty("--lab", lab.toFixed(3));
          var tab = c.querySelector(".ap-tab");
          if (tab) {
            if (i === active) tab.setAttribute("aria-current", "location");
            else tab.removeAttribute("aria-current");
          }
        }
      }, []);

      /* Mesure : où doit-on scroller pour amener chaque carte en position ? */
      var measure = useCallback(function () {
        var stack = stackRef.current;
        var cards = cardRefs.current;
        if (!stack || !cards.length) return;

        // Si le header est sticky/fixed, les cartes se collent sous lui
        var header = document.querySelector(".site-header");
        var apTop = 0;
        if (header) {
          var pos = getComputedStyle(header).position;
          if (pos === "fixed" || pos === "sticky") apTop = header.getBoundingClientRect().height;
        }
        stack.style.setProperty("--ap-top", apTop + "px");

        var stackTop = stack.getBoundingClientRect().top + window.scrollY;
        var acc = 0;
        var ys = [];
        for (var i = 0; i < cards.length; i++) {
          var c = cards[i];
          var stickyTop = parseFloat(getComputedStyle(c).top) || 0;
          ys.push(stackTop + acc - stickyTop);
          acc += c.offsetHeight;
        }
        geo.current = { ys: ys };
        update();
      }, [update]);

      var scrollToSection = useCallback(function (i, opts) {
        opts = opts || {};
        var y = geo.current.ys[i];
        if (y == null) return;
        window.scrollTo({
          top: Math.max(0, y),
          behavior: (opts.instant || reduceMotion()) ? "auto" : "smooth"
        });
        if (opts.updateHash !== false && window.history && history.replaceState) {
          history.replaceState(null, "", "#" + SECTIONS[i].id);
        }
      }, []);

      useEffect(function () {
        function goToHash(instant) {
          var id = decodeURIComponent(location.hash.slice(1));
          var idx = -1;
          for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) idx = i;
          if (idx >= 0) scrollToSection(idx, { instant: instant === true, updateHash: false });
        }
        function onScroll() {
          if (raf.current) return;
          raf.current = requestAnimationFrame(function () { raf.current = 0; update(); });
        }
        var timer;
        function onResize() { clearTimeout(timer); timer = setTimeout(measure, 80); }
        function onLoad() { measure(); goToHash(true); }
        function onHash(e) { goToHash(e); }

        measure();
        requestAnimationFrame(function () { goToHash(true); });

        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onResize);
        window.addEventListener("load", onLoad);
        window.addEventListener("hashchange", onHash);

        var ro = null;
        if ("ResizeObserver" in window) {
          ro = new ResizeObserver(onResize);
          ro.observe(document.body);
          var h = document.querySelector(".site-header");
          if (h) ro.observe(h);
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

        return function () {
          clearTimeout(timer);
          cancelAnimationFrame(raf.current);
          window.removeEventListener("scroll", onScroll);
          window.removeEventListener("resize", onResize);
          window.removeEventListener("load", onLoad);
          window.removeEventListener("hashchange", onHash);
          if (ro) ro.disconnect();
        };
      }, [measure, update, scrollToSection]);

      return html`
        <div className="ap-stack" ref=${stackRef}>
          ${SECTIONS.map(function (s, i) {
            return html`<${Card} key=${s.id} section=${s} index=${i} cardRefs=${cardRefs} onTabClick=${scrollToSection} />`;
          })}
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById("apropos-root")).render(html`<${App} />`);
  })();
  </script>
</body>
</html>
